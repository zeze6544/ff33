# Keeps lost.pink / Vercel production current with the latest Cursor agent branch.
# Vercel production tracks `main`; this job points main at the tip of the
# most recently updated open PR (or newest cursor/* branch) every ten minutes.
name: Auto production redeploy

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches:
      - 'cursor/**'

concurrency:
  group: auto-prod-redeploy
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve source branch
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open --json headRefName,updatedAt --jq 'sort_by(.updatedAt) | reverse | .[0].headRefName // empty')"
          if [ -z "$BRANCH" ]; then
            BRANCH="$(git for-each-ref --sort=-committerdate --format='%(refname:short)' 'refs/remotes/origin/cursor/*' | head -n1 | sed 's#^origin/##')"
          fi
          if [ -z "$BRANCH" ]; then
            echo "No open PR or cursor/* branch — nothing to sync."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Do not re-enter from the push this job itself makes to main.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "main" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Source branch: $BRANCH"

      - name: Point main at the agent tip
        if: steps.src.outputs.skip != 'true'
        env:
          BRANCH: ${{ steps.src.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "torxth-auto-deploy"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH" main
          SRC_SHA="$(git rev-parse "origin/$BRANCH")"
          MAIN_SHA="$(git rev-parse origin/main)"
          if [ "$SRC_SHA" = "$MAIN_SHA" ]; then
            echo "main already at $SRC_SHA — Vercel is current."
            exit 0
          fi
          git checkout -B main "origin/$BRANCH"
          # Production tip is the agent tip. Force-with-lease covers the case
          # where main and the agent branch diverged on the same workflow file.
          git push --force-with-lease=main:"$MAIN_SHA" origin main
          echo "Pushed main → $(git rev-parse HEAD). Vercel production redeploy will follow."
