# Keeps lost.pink / Vercel production current with the latest Cursor agent branch.
# 1) Points `main` at the tip of the newest open PR (or newest cursor/* branch)
# 2) Redeploys the `torxth/` app to Vercel production when VERCEL_TOKEN is set
name: Auto production redeploy

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches:
      - 'cursor/**'

concurrency:
  group: auto-prod-redeploy
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

jobs:
  sync-main:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.tip.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve source branch
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open --json headRefName,updatedAt --jq 'sort_by(.updatedAt) | reverse | .[0].headRefName // empty')"
          if [ -z "$BRANCH" ]; then
            BRANCH="$(git for-each-ref --sort=-committerdate --format='%(refname:short)' 'refs/remotes/origin/cursor/*' | head -n1 | sed 's#^origin/##')"
          fi
          if [ -z "$BRANCH" ]; then
            echo "No open PR or cursor/* branch — nothing to sync."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Source branch: $BRANCH"

      - name: Point main at the agent tip
        id: tip
        if: steps.src.outputs.skip != 'true'
        env:
          BRANCH: ${{ steps.src.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "torxth-auto-deploy"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH" main
          SRC_SHA="$(git rev-parse "origin/$BRANCH")"
          MAIN_SHA="$(git rev-parse origin/main)"
          echo "sha=$SRC_SHA" >> "$GITHUB_OUTPUT"
          if [ "$SRC_SHA" = "$MAIN_SHA" ]; then
            echo "main already at $SRC_SHA"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout -B main "origin/$BRANCH"
          git push --force-with-lease=main:"$MAIN_SHA" origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Pushed main → $SRC_SHA"

  vercel-prod:
    needs: sync-main
    if: needs.sync-main.outputs.sha != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: torxth
    steps:
      - name: Checkout production tip
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: torxth/package-lock.json

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Deploy to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::warning::VERCEL_TOKEN is not set. Main was synced; add the three Vercel secrets so this job can push production every ten minutes."
            echo "Required repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID"
            exit 0
          fi
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
